<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 雙擊縮放已由 touch-action: manipulation 處理；保留雙指縮放以符合無障礙需求 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易點餐系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (Noto Sans TC 與 Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <style>
        /* 全域鎖定觸控行為為 manipulation，徹底消除行動端瀏覽器 300ms 點擊延遲與連點縮放 */
        html, body, button {
            touch-action: manipulation;
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        /* 自訂捲軸樣式，讓明細區域更美觀 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* 隱藏橫向分類導覽列的捲軸但保留滑動功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        html {
            scroll-behavior: smooth;
        }
        #order-summary-section {
            scroll-margin-top: calc(var(--header-h, 57px) + 8px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-20 lg:pb-0">

    <!-- 頂部導覽列與餐廳切換頁籤 -->
    <header id="main-header" class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-3 pb-2.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5">
            <!-- 動態餐廳標題與獨立網址分享按鈕 -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5">
                    <div class="bg-amber-500 text-white p-2 rounded-xl shadow-sm">
                        <i data-lucide="utensils" class="w-5 h-5"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 id="header-title" class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">簡易點餐系統</h1>
                        <a id="header-phone" href="#" class="hidden items-center gap-1 text-xs font-medium text-amber-700 hover:text-amber-900 mt-0.5"><i data-lucide="phone" class="w-3 h-3"></i><span></span></a>
                    </div>
                </div>
                <button
                    type="button"
                    onclick="copyStoreUrl()"
                    class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 text-xs font-medium hover:bg-slate-100 hover:text-slate-900 active:scale-95 transition shrink-0"
                    title="複製此餐廳的專屬獨立網址"
                >
                    <i data-lucide="link" class="w-3.5 h-3.5 text-amber-600"></i>
                    <span>複製網址</span>
                </button>
            </div>

            <!-- 餐廳切換頁籤容器 (獨立模式下自動隱藏) -->
            <nav id="store-tabs" class="flex items-center gap-2 overflow-x-auto pb-0.5 sm:pb-0" aria-label="餐廳選擇">
                <!-- 頁籤將透過 JavaScript 動態渲染 -->
            </nav>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- 左側：菜單選擇區 (佔 7 欄) -->
            <div class="lg:col-span-7 space-y-4">
                
                <!-- 置頂快速導覽工具列 (搜尋 + 分類錨點) -->
                <div id="menu-sticky-toolbar" style="top: var(--header-h, 57px)" class="sticky z-20 bg-slate-50/95 backdrop-blur-md pt-1 pb-2.5 -mx-4 px-4 sm:mx-0 sm:px-0 border-b border-slate-200/70 space-y-2">
                    <!-- 搜尋框＋袋別（同一列） -->
                    <div class="flex items-center gap-2">
                    <div class="relative flex-1 min-w-0">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input 
                            type="text" 
                            id="menu-search-input" 
                            placeholder="搜尋餐點" 
                            class="w-full pl-9 pr-9 py-2 rounded-xl border border-slate-200 bg-white text-base sm:text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 shadow-sm transition"
                        />
                        <button 
                            type="button" 
                            id="clear-search-btn"
                            onclick="clearMenuSearch()"
                            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 p-1 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition"
                            aria-label="清除搜尋"
                        >
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="relative shrink-0">
                        <i data-lucide="shopping-bag" class="w-4 h-4 text-amber-600 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <select id="bag-select" class="appearance-none pl-9 pr-7 py-2 rounded-xl border border-slate-200 bg-white text-base sm:text-sm font-bold text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition"></select>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    </div>
                    </div>

                    <!-- 橫向分類快速跳轉膠囊列 -->
                    <div id="category-nav-pills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                        <!-- 分類膠囊按鈕由 JS 動態產生 -->
                    </div>
                </div>

                <!-- 搜尋無結果提示 -->
                <div id="search-empty-state" class="hidden bg-white rounded-2xl border border-slate-200 p-8 text-center">
                    <i data-lucide="search-x" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                    <p class="text-sm font-bold text-slate-700">找不到符合的餐點</p>
                    <p class="text-xs text-slate-400 mt-1">請嘗試其他關鍵字，或點擊下方按鈕顯示全部菜單</p>
                    <button type="button" onclick="clearMenuSearch()" class="mt-3 px-4 py-1.5 rounded-xl bg-amber-500 text-slate-950 text-xs font-bold hover:bg-amber-400 transition">
                        顯示全部菜單
                    </button>
                </div>

                <!-- 菜單分類區塊容器 -->
                <div class="space-y-4" id="menu-container">
                    <!-- 菜單分類將透過 JavaScript 動態渲染於此 -->
                </div>
            </div>

            <!-- 右側：點餐明細與輸出區 (佔 5 欄，在桌機版固定於上方) -->
            <div id="order-summary-section" class="lg:col-span-5 lg:sticky lg:top-20 space-y-4 scroll-mt-24">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <!-- 明細標題列 -->
                    <div class="p-4 sm:p-5 bg-slate-900 text-white flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="receipt" class="w-5 h-5 text-amber-400"></i>
                            <h2 id="order-panel-title" class="font-bold text-base sm:text-lg">點餐明細（依菜單順序）</h2>
                        </div>
                        <span id="total-count-badge" class="bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-full shrink-0">
                            共 0 份
                        </span>
                    </div>

                    <!-- 互動式明細列表 -->
                    <div class="p-4 sm:p-5 max-h-[42vh] overflow-y-auto border-b border-slate-100" id="order-list-container">
                        <!-- 空白狀態 -->
                        <div id="empty-state" class="py-10 text-center text-slate-400 flex flex-col items-center justify-center">
                            <i data-lucide="clipboard-list" class="w-12 h-12 mb-3 text-slate-300 stroke-[1.5]"></i>
                            <p class="text-sm font-medium text-slate-500">尚未選擇任何餐點</p>
                            <p class="text-xs mt-1">請從左側菜單點擊品項開始點餐</p>
                        </div>
                        
                        <!-- 訂單項目列表 -->
                        <ul id="order-items-list" class="space-y-2.5 hidden">
                            <!-- 動態產生項目 -->
                        </ul>
                    </div>

                    <!-- 純文字輸出預覽區 -->
                    <div class="p-4 sm:p-5 bg-slate-50 space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="output-textarea" class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                                輸出格式預覽 (品項 x數量)
                            </label>
                        </div>
                        
                        <!-- font-size 設為 16px (text-base)，防止 iOS Safari 點擊輸入框時自動放大畫面 -->
                        <textarea 
                            id="output-textarea" 
                            rows="6" 
                            readonly 
                            placeholder="點餐後的文字明細將顯示在這裡..."
                            class="w-full rounded-xl border border-slate-200 bg-white p-3 text-base text-slate-700 font-mono focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none shadow-inner"
                        ></textarea>

                        <!-- 操作按鈕群 -->
                        <div class="grid grid-cols-3 gap-2.5 pt-1">
                            <button 
                                id="clear-btn" 
                                type="button"
                                class="col-span-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 hover:text-slate-900 active:scale-[0.98] transition disabled:opacity-40 disabled:pointer-events-none"
                                disabled
                            >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                <span>清空</span>
                            </button>
                            <button 
                                id="copy-btn" 
                                type="button"
                                class="col-span-2 flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-xl bg-amber-500 text-slate-950 text-sm font-bold hover:bg-amber-400 active:scale-[0.98] transition shadow-sm disabled:opacity-40 disabled:pointer-events-none"
                                disabled
                            >
                                <i data-lucide="copy" class="w-4 h-4"></i>
                                <span>複製點餐明細</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 手機版底部懸浮點餐狀態列 (免滑回最下方即可一鍵跳至明細區) -->
    <div id="mobile-floating-bar" class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-slate-900/95 backdrop-blur-md text-white border-t border-slate-800 px-4 py-2.5 shadow-2xl flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-9 h-9 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-bold shrink-0">
                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
            </div>
            <div class="min-w-0">
                <div class="text-xs text-slate-400">目前點餐進度</div>
                <div id="mobile-bar-summary" class="text-sm font-bold text-white truncate">尚未選擇餐點</div>
            </div>
        </div>
        <button 
            type="button" 
            onclick="scrollToOrderSummary()"
            class="px-4 py-2 rounded-xl bg-amber-500 text-slate-950 text-xs sm:text-sm font-bold hover:bg-amber-400 active:scale-95 transition shrink-0 flex items-center gap-1 shadow-sm"
        >
            <span>查看與複製</span>
            <i data-lucide="arrow-down" class="w-3.5 h-3.5"></i>
        </button>
    </div>

    <!-- 右下角回到最上方 TOP 按鈕 -->
    <button
        id="back-to-top-btn"
        type="button"
        onclick="scrollToTop()"
        aria-label="回到最上方"
        title="回到最上方"
        class="fixed bottom-20 lg:bottom-6 right-4 sm:right-6 z-40 w-11 h-11 rounded-full bg-slate-900/90 hover:bg-amber-500 text-white hover:text-slate-950 border border-slate-700 hover:border-amber-400 shadow-lg backdrop-blur-sm flex flex-col items-center justify-center transition-all duration-300 opacity-0 translate-y-4 pointer-events-none active:scale-90"
    >
        <i data-lucide="arrow-up" class="w-4 h-4 -mb-0.5"></i>
        <span class="text-[10px] font-bold tracking-tight leading-none">TOP</span>
    </button>

    <!-- 提示訊息 Toast (取代 alert) -->
    <div id="toast" role="status" aria-live="polite" class="fixed bottom-36 lg:bottom-20 right-4 sm:right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5 text-sm font-medium border border-slate-700">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
            <span id="toast-message">已複製到剪貼簿！</span>
        </div>
    </div>

    <!-- 彈窗 A：三寶麵線專用客製化彈窗 (醋、沙茶) -->
    <div id="custom-modal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden">
            <!-- Modal 標題 -->
            <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
                <div>
                    <span class="text-xs text-amber-400 font-semibold block">單品口味客製化</span>
                    <h3 id="modal-item-title" class="text-lg font-bold mt-0.5">大腸麵線(大)</h3>
                </div>
                <button type="button" onclick="closeCustomModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal 選項內容 -->
            <div class="p-5 space-y-5">
                <!-- 醋選項 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">黑醋調整</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="vinegar" data-val="">正常</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="vinegar" data-val="醋多">醋多</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="vinegar" data-val="不要醋">不要醋</button>
                    </div>
                </div>

                <!-- 沙茶選項 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">沙茶調整</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="shacha" data-val="">正常</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="shacha" data-val="沙茶多">沙茶多</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="shacha" data-val="不要沙茶">不要沙茶</button>
                    </div>
                </div>

                <!-- 份數調整 -->
                <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                    <span class="text-sm font-bold text-slate-700">此客製口味份數</span>
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="changeModalQty(-1)" class="w-9 h-9 rounded-lg border border-slate-300 bg-white text-slate-700 flex items-center justify-center hover:bg-slate-100 active:scale-90 transition">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                        <span id="modal-qty-display" class="w-6 text-center font-bold text-base text-slate-900">1</span>
                        <button type="button" onclick="changeModalQty(1)" class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center hover:bg-amber-400 active:scale-90 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Modal 底部按鈕 -->
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2.5">
                <button type="button" onclick="closeCustomModal()" class="px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 transition">
                    取消
                </button>
                <button type="button" onclick="confirmCustomOrder()" class="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 text-sm font-bold hover:bg-amber-400 shadow-sm transition">
                    確認加入
                </button>
            </div>
        </div>
    </div>

    <!-- 彈窗 B：先選品項、再選口味/規格彈窗 (8方雲集整併品項專用) -->
    <div id="variant-modal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden">
            <!-- Modal 標題 -->
            <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
                <div>
                    <span class="text-xs text-amber-400 font-semibold block">先選品項・再選口味</span>
                    <h3 id="variant-modal-title" class="text-lg font-bold mt-0.5">牛湯餃</h3>
                </div>
                <button type="button" onclick="closeVariantModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 口味選項列表 -->
            <div class="p-5 space-y-4">
                <div id="variant-options-grid" class="space-y-4">
                    <!-- 動態渲染湯底／口味按鈕 -->
                </div>
                <div class="rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 text-sm">
                    <span class="text-slate-400">本次點選：</span><span id="variant-preview" class="font-bold text-slate-800"></span>
                </div>

                <!-- 份數調整 -->
                <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                    <span class="text-sm font-bold text-slate-700">選擇數量</span>
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="changeVariantQty(-1)" class="w-9 h-9 rounded-lg border border-slate-300 bg-white text-slate-700 flex items-center justify-center hover:bg-slate-100 active:scale-90 transition">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                        <span id="variant-qty-display" class="w-6 text-center font-bold text-base text-slate-900">1</span>
                        <button type="button" onclick="changeVariantQty(1)" class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center hover:bg-amber-400 active:scale-90 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Modal 底部按鈕 -->
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2.5">
                <button type="button" onclick="closeVariantModal()" class="px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 transition">
                    取消
                </button>
                <button type="button" onclick="confirmVariantOrder()" class="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 text-sm font-bold hover:bg-amber-400 shadow-sm transition">
                    加入明細
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 多餐廳菜單資料庫 (編號：香村=1, 阿花=2, 三寶麵線=3, 零五=5, 8方雲集=8)
        // ==========================================
        const STORES_DATA = [
            {
                id: "xiangcun",
                paramCode: "1",
                shortName: "香村",
                title: "香村簡易點餐系統",
                phone: "049-2580155",
                menu: [
                    {
                        category: "火鍋",
                        icon: "flame",
                        color: "text-rose-500",
                        bgBadge: "bg-rose-50",
                        items: [
                            "韓式泡菜鍋",
                            "海鮮豆腐鍋",
                            "沙茶牛肉鍋",
                            "沙茶羊肉鍋",
                            "經典泡菜鍋",
                            "沙茶豬肉鍋",
                            "單點白飯"
                        ]

        // ==========================================
        // 2. 狀態管理與多店獨立儲存空間
        // ==========================================
        // 將所有「先選品項、再選口味」品項統一成 optionGroups + variants（variants 含 combo 索引）
        (function normalizeVariantItems() {
            STORES_DATA.forEach(store => store.menu.forEach(group => group.items.forEach(item => {
                if (typeof item === 'string') return;
                if (Array.isArray(item.optionGroups)) {
                    let combos = [[]];
                    item.optionGroups.forEach(g => {
                        combos = combos.flatMap(c => g.options.map((_, oi) => [...c, oi]));
                    });
                    item.variants = combos.map(combo => {
                        const labels = combo.map((oi, gi) => item.optionGroups[gi].options[oi]);
                        const fullName = item.fullNameTemplate.replace(/\{(\w+)\}/g, (_, key) =>
                            labels[item.optionGroups.findIndex(g => g.key === key)]);
                        return { label: labels.join(' / '), fullName, combo };
                    });
                } else if (Array.isArray(item.variants)) {
                    item.optionGroups = [{ key: 'v', label: item.promptLabel || '請選擇口味', options: item.variants.map(v => v.label) }];
                    item.variants.forEach((v, i) => { v.combo = [i]; });
                }
            })));
        })();

        // 分袋：預設放入「工廠」，可切換為其他袋別
        const BAGS = ['工廠', '名間', '什麼綠'];
        const BAG_STYLES = ['bg-sky-100 text-sky-800', 'bg-violet-100 text-violet-800', 'bg-emerald-100 text-emerald-800'];
        let currentBag = 0;

        let currentStoreId = STORES_DATA[0].id;
        let isSoloMode = false;
        let currentSearchQuery = '';
        let activeCategoryIndex = 0;
        const collapsedCategories = {};

        const storeOrders = {};
        const storeOrderMaps = {};

        // 建立每家餐廳的訂單陣列與菜單順序索引 Map（含所有變體口味的排序權重）
        STORES_DATA.forEach(store => {
            storeOrders[store.id] = [];
            const orderMap = new Map();
            let seq = 0;
            store.menu.forEach(group => {
                group.items.forEach(itemObj => {
                    if (typeof itemObj === 'string') {
                        orderMap.set(itemObj, seq++);
                    } else if (Array.isArray(itemObj.variants)) {
                        orderMap.set(itemObj.name, seq);
                        itemObj.variants.forEach(v => {
                            orderMap.set(v.fullName, seq++);
                        });
                    } else {
                        orderMap.set(itemObj.name, seq++);
                    }
                });
            });
            storeOrderMaps[store.id] = orderMap;
        });

        let toastTimeout = null;

        // 彈窗 A：三寶麵線客製化狀態
        let modalState = {
            editingOrderId: null,
            itemName: '',
            vinegar: '',
            shacha: '',
            qty: 1
        };

        // 彈窗 B：先選品項、再選口味彈窗狀態
        let variantModalState = {
            baseName: '',
            groups: [],
            variants: [],
            selected: [],
            qty: 1
        };

        // ==========================================
        // 3. DOM 元素參照
        // ==========================================
        const headerTitle = document.getElementById('header-title');
        const storeTabs = document.getElementById('store-tabs');
        const menuContainer = document.getElementById('menu-container');
        const categoryNavPills = document.getElementById('category-nav-pills');
        const menuSearchInput = document.getElementById('menu-search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const searchEmptyState = document.getElementById('search-empty-state');
        const mobileBarSummary = document.getElementById('mobile-bar-summary');
        const orderItemsList = document.getElementById('order-items-list');
        const emptyState = document.getElementById('empty-state');
        const outputTextarea = document.getElementById('output-textarea');
        const totalCountBadge = document.getElementById('total-count-badge');
        const copyBtn = document.getElementById('copy-btn');
        const clearBtn = document.getElementById('clear-btn');
        const toastEl = document.getElementById('toast');
        const toastMsgEl = document.getElementById('toast-message');
        const customModal = document.getElementById('custom-modal');
        const modalItemTitle = document.getElementById('modal-item-title');
        const modalQtyDisplay = document.getElementById('modal-qty-display');
        const variantModal = document.getElementById('variant-modal');
        const variantModalTitle = document.getElementById('variant-modal-title');
        const variantPreview = document.getElementById('variant-preview');
        const variantOptionsGrid = document.getElementById('variant-options-grid');
        const variantQtyDisplay = document.getElementById('variant-qty-display');
        const backToTopBtn = document.getElementById('back-to-top-btn');

        function safeIcons() {
            try { if (window.lucide) window.lucide.createIcons(); } catch (e) { console.warn('lucide error', e); }
        }

        function getCurrentStore() {
            return STORES_DATA.find(s => s.id === currentStoreId) || STORES_DATA[0];
        }

        function getCurrentOrderList() {
            return storeOrders[currentStoreId];
        }

        // 依據網址參數或 Hash 解析目標餐廳（支援 ?store=8、?s=8、#8 或原本的 id）
        function resolveStoreFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawParam = urlParams.get('store') || urlParams.get('s') || window.location.hash.replace('#', '');
            if (!rawParam) return null;

            const matched = STORES_DATA.find(s => s.paramCode === rawParam || s.id === rawParam);
            return matched ? matched.id : null;
        }

        // 查找當前餐廳中某品項的設定資訊
        function findMenuItemConfig(itemName) {
            const store = getCurrentStore();
            for (const group of store.menu) {
                for (const itemObj of group.items) {
                    const name = typeof itemObj === 'string' ? itemObj : itemObj.name;
                    if (name === itemName) {
                        return {
                            group,
                            itemObj,
                            allowDuplicateEntries: Boolean(group.allowDuplicateEntries),
                            defaultQty: group.defaultQty || 1,
                            customizable: Boolean(group.customizable || (typeof itemObj === 'object' && itemObj.customizable)),
                            variants: (typeof itemObj === 'object' && Array.isArray(itemObj.variants)) ? itemObj.variants : null
                        };
                    }
                }
            }
            return null;
        }

        // 避免 HTML 屬性中的單引號或特殊字元造成 XSS 或語法錯誤
        function escapeHtmlAttr(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // ==========================================
        // 4. 初始化與渲染函數
        // ==========================================
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetStoreId = resolveStoreFromUrl();

            const soloParam = urlParams.get('solo');
            if (soloParam === '0') {
                isSoloMode = false;
            } else if (soloParam === '1' || targetStoreId !== null) {
                isSoloMode = true;
            }

            if (targetStoreId) {
                currentStoreId = targetStoreId;
            }

            window.addEventListener('hashchange', () => {
                const nextStoreId = resolveStoreFromUrl();
                if (nextStoreId && nextStoreId !== currentStoreId) {
                    switchStore(nextStoreId, false);
                }
            });

            // 綁定三寶麵線客製化彈窗選項點擊
            document.querySelectorAll('.opt-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const group = btn.dataset.group;
                    const val = btn.dataset.val;
                    modalState[group] = val;
                    updateModalButtonsUI();
                });
            });

            if (customModal) {
                customModal.addEventListener('click', (e) => {
                    if (e.target === customModal) closeCustomModal();
                });
            }

            if (variantModal) {
                variantModal.addEventListener('click', (e) => {
                    if (e.target === variantModal) closeVariantModal();
                });
            }

            if (menuSearchInput) {
                menuSearchInput.addEventListener('input', (e) => {
                    if (e.isComposing) return; // 組字中不篩選，避免閃現「找不到」
                    currentSearchQuery = e.target.value.trim();
                    if (clearSearchBtn) {
                        clearSearchBtn.classList.toggle('hidden', currentSearchQuery.length === 0);
                    }
                    renderMenu();
                    updateOrderUI();
                    safeIcons();
                });
            }

            // 支援 ESC 鍵快速關閉開啟中的彈窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!customModal.classList.contains('hidden')) closeCustomModal();
                    if (!variantModal.classList.contains('hidden')) closeVariantModal();
                }
            });

            // 以 rAF 節流，避免每次 scroll 事件都強制重排
            let scrollTicking = false;
            window.addEventListener('scroll', () => {
                if (scrollTicking) return;
                scrollTicking = true;
                requestAnimationFrame(() => { scrollTicking = false; handleScrollSpy(); });
            }, { passive: true });

            // 動態同步 header 高度（多店頁籤換行時，固定的搜尋列才不會被蓋住）
            const headerEl = document.getElementById('main-header');
            const syncHeaderHeight = () => document.documentElement.style.setProperty('--header-h', headerEl.offsetHeight + 'px');
            syncHeaderHeight();
            if (window.ResizeObserver) new ResizeObserver(syncHeaderHeight).observe(headerEl);
            else window.addEventListener('resize', syncHeaderHeight);

            // 注音/拼音組字結束後才觸發搜尋
            if (menuSearchInput) {
                menuSearchInput.addEventListener('compositionend', () => menuSearchInput.dispatchEvent(new Event('input')));
            }

            // 重新整理即清空訂單：順便清掉舊版留下的暫存資料
            try { localStorage.removeItem('quick-order-v1'); } catch (e) { /* ignore */ }
            switchStore(currentStoreId);

            copyBtn.addEventListener('click', copyOrderToClipboard);
            clearBtn.addEventListener('click', clearAllOrders);
        }

        window.switchStore = function(storeId) {
            currentStoreId = storeId;
            currentBag = 0; // 切換餐廳時回到預設袋別
            currentSearchQuery = '';
            activeCategoryIndex = 0;

            const store = getCurrentStore();

            document.title = store.title;
            headerTitle.textContent = store.title;

            const phoneEl = document.getElementById('header-phone');
            if (phoneEl) {
                const hasPhone = Boolean(store.phone);
                phoneEl.classList.toggle('hidden', !hasPhone);
                phoneEl.classList.toggle('inline-flex', hasPhone);
                if (hasPhone) {
                    phoneEl.href = 'tel:' + store.phone.replace(/[^\d+]/g, '');
                    phoneEl.querySelector('span').textContent = store.phone;
                }
            }

            if (menuSearchInput) menuSearchInput.value = '';
            if (clearSearchBtn) clearSearchBtn.classList.add('hidden');

            renderStoreTabs();
            renderCategoryNav();
            renderMenu();
            updateOrderUI();
            safeIcons();
        };

        window.clearMenuSearch = function() {
            currentSearchQuery = '';
            if (menuSearchInput) menuSearchInput.value = '';
            if (clearSearchBtn) clearSearchBtn.classList.add('hidden');
            renderMenu();
            updateOrderUI();
            safeIcons();
        };

        window.scrollToOrderSummary = function() {
            const target = document.getElementById('order-summary-section');
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        window.scrollToTop = function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        };

        window.scrollToCategory = function(catIndex) {
            activeCategoryIndex = catIndex;
            const collapseKey = `${currentStoreId}_${catIndex}`;
            if (collapsedCategories[collapseKey]) {
                collapsedCategories[collapseKey] = false;
                renderMenu();
                updateOrderUI();
                safeIcons();
            }

            renderCategoryNav();

            const targetEl = document.getElementById(`cat-section-${catIndex}`);
            if (targetEl) {
                const headerOffset = getStickyOffset() + 8;
                const elementPosition = targetEl.getBoundingClientRect().top;
                const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

                window.scrollTo({
                    top: Math.max(0, offsetPosition),
                    behavior: 'smooth'
                });
            }
        };

        window.toggleCategoryCollapse = function(catIndex) {
            const key = `${currentStoreId}_${catIndex}`;
            collapsedCategories[key] = !collapsedCategories[key];
            renderMenu();
            updateOrderUI();
            safeIcons();
        };

function getOrdersByBag(list) {
            return [...list].sort((a, b) => a.bag - b.bag); // 穩定排序：袋內維持菜單順序
        }

        // 超過一袋、或唯一使用的袋別不是預設袋時，才顯示袋別標題
        function bagHeaderNeeded(list) {
            const used = new Set(list.map(o => o.bag));
            return used.size > 1 || (used.size === 1 && !used.has(0));
        }

        function renderBagSwitcher() {
            const sel = document.getElementById('bag-select');
            if (!sel) return;
            if (!sel.options.length) {
                BAGS.forEach((name, i) => sel.add(new Option(name, i)));
                sel.setAttribute('aria-label', '點餐放入的袋別');
                sel.addEventListener('change', () => { currentBag = Number(sel.value); });
            }
            sel.value = String(currentBag);
        }

        // 點明細上的袋別標籤，輪流換到下一袋（同品項同備註會自動合併）
        window.cycleOrderBag = function(orderId) {
            const list = getCurrentOrderList();
            const item = list.find(o => o.id === orderId);
            if (!item) return;
            item.bag = (item.bag + 1) % BAGS.length;
            const cfg = findMenuItemConfig(item.name);
            if (!(cfg && cfg.allowDuplicateEntries)) {
                const dup = list.find(o => o !== item && o.name === item.name && o.note === item.note && o.bag === item.bag);
                if (dup) {
                    dup.qty += item.qty;
                    storeOrders[currentStoreId] = list.filter(o => o !== item);
                }
            }
            renderStoreTabs();
            updateOrderUI();
        };

        function getStickyOffset() {
            const h = document.getElementById('main-header');
            const t = document.getElementById('menu-sticky-toolbar');
            return (h ? h.offsetHeight : 0) + (t ? t.offsetHeight : 0);
        }

        function handleScrollSpy() {
            // 控制右下角 TOP 按鈕的顯示與隱藏（向下捲動超過 200px 時顯示）
            if (backToTopBtn) {
                if (window.scrollY > 200) {
                    backToTopBtn.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                } else {
                    backToTopBtn.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                }
            }

            if (currentSearchQuery) return;
            const store = getCurrentStore();
            const threshold = getStickyOffset() + 24;
            let detectedIndex = 0;

            store.menu.forEach((_, idx) => {
                const el = document.getElementById(`cat-section-${idx}`);
                if (el) {
                    const rect = el.getBoundingClientRect();
                    if (rect.top <= threshold) {
                        detectedIndex = idx;
                    }
                }
            });

            if (detectedIndex !== activeCategoryIndex) {
                activeCategoryIndex = detectedIndex;
                renderCategoryNav();
            }
        }

        // 渲染橫向分類快速跳轉膠囊列
        function renderCategoryNav() {
            if (!categoryNavPills) return;
            const store = getCurrentStore();
            const orderList = getCurrentOrderList();

            if (currentSearchQuery) {
                categoryNavPills.classList.add('hidden');
                return;
            }
            categoryNavPills.classList.remove('hidden');
            categoryNavPills.innerHTML = '';

            store.menu.forEach((group, idx) => {
                // 蒐集該分類所有可能的品名（包含變體全名）以正確統計該分類已點份數
                const catItemNames = new Set();
                group.items.forEach(i => {
                    if (typeof i === 'string') {
                        catItemNames.add(i);
                    } else {
                        catItemNames.add(i.name);
                        if (Array.isArray(i.variants)) {
                            i.variants.forEach(v => catItemNames.add(v.fullName));
                        }
                    }
                });

                const catOrderedQty = orderList
                    .filter(o => catItemNames.has(o.name))
                    .reduce((sum, o) => sum + o.qty, 0);

                const isActive = idx === activeCategoryIndex;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => scrollToCategory(idx);
                btn.className = isActive
                    ? 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-500 text-slate-950 text-xs font-bold shadow-sm transition shrink-0'
                    : 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-white border border-slate-200 text-slate-600 text-xs font-medium hover:border-amber-400 hover:text-slate-900 transition shrink-0';

                const countBadge = catOrderedQty > 0
                    ? `<span class="px-1.5 py-0.2 rounded-full text-[11px] font-bold ${isActive ? 'bg-slate-900 text-amber-400' : 'bg-amber-100 text-amber-800'}">${catOrderedQty}</span>`
                    : `<span class="text-[11px] opacity-60">(${group.items.length})</span>`;

                btn.innerHTML = `<span>${group.category}</span>${countBadge}`;
                categoryNavPills.appendChild(btn);
            });
        }

        function renderStoreTabs() {
            if (isSoloMode) {
                storeTabs.classList.add('hidden');
                return;
            }
            storeTabs.classList.remove('hidden');
            storeTabs.innerHTML = '';

            STORES_DATA.forEach(store => {
                const isActive = store.id === currentStoreId;
                const storeTotalQty = storeOrders[store.id].reduce((sum, item) => sum + item.qty, 0);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => switchStore(store.id);
                
                btn.className = isActive
                    ? 'flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold shadow-sm transition shrink-0'
                    : 'flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 text-sm font-medium hover:bg-slate-200 hover:text-slate-900 transition shrink-0';

                const badgeHtml = storeTotalQty > 0
                    ? `<span class="px-1.5 py-0.2 rounded-full text-xs font-bold ${isActive ? 'bg-amber-500 text-slate-950' : 'bg-amber-200 text-amber-900'}">${storeTotalQty}</span>`
                    : '';

                btn.innerHTML = `
                    <span>${store.shortName}</span>
                    ${badgeHtml}
                `;
                storeTabs.appendChild(btn);
            });
        }

        // 渲染當前餐廳左側菜單卡片
        function renderMenu() {
            const store = getCurrentStore();
            menuContainer.innerHTML = '';

            const keyword = currentSearchQuery.toLowerCase();
            let totalMatchedItems = 0;

            store.menu.forEach((group, catIndex) => {
                const filteredItems = keyword
                    ? group.items.filter(itemObj => {
                        if (typeof itemObj === 'string') {
                            return itemObj.toLowerCase().includes(keyword);
                        }
                        const baseMatch = itemObj.name.toLowerCase().includes(keyword);
                        const variantMatch = Array.isArray(itemObj.variants) &&
                            itemObj.variants.some(v => v.fullName.toLowerCase().includes(keyword) || v.label.toLowerCase().includes(keyword));
                        return baseMatch || variantMatch;
                    })
                    : group.items;

                if (filteredItems.length === 0) return;
                totalMatchedItems += filteredItems.length;

                const isCollapsed = !keyword && Boolean(collapsedCategories[`${currentStoreId}_${catIndex}`]);

                const section = document.createElement('section');
                section.id = `cat-section-${catIndex}`;
                section.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-3.5 sm:p-5 transition-all';

                const dupHintHtml = group.allowDuplicateEntries
                    ? `<span class="text-[11px] font-medium text-amber-700 bg-amber-50 border border-amber-200/80 px-2 py-0.5 rounded-full">可分筆</span>`
                    : '';

                const headerHtml = `
                    <button 
                        type="button" 
                        onclick="toggleCategoryCollapse(${catIndex})"
                        class="w-full flex items-center justify-between ${isCollapsed ? '' : 'mb-3.5 pb-2.5 border-b border-slate-100'} text-left group"
                    >
                        <div class="flex items-center gap-2 flex-wrap">
                            <div class="p-1.5 rounded-lg ${group.bgBadge} ${group.color}">
                                <i data-lucide="${group.icon}" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                            </div>
                            <h3 class="font-bold text-base sm:text-lg text-slate-800">${group.category}</h3>
                            <span class="text-xs font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">${filteredItems.length} 項</span>
                            ${dupHintHtml}
                        </div>
                        <div class="flex items-center gap-1 text-xs text-slate-400 group-hover:text-slate-700 transition shrink-0">
                            <span>${isCollapsed ? '展開' : '收合'}</span>
                            <i data-lucide="${isCollapsed ? 'chevron-down' : 'chevron-up'}" class="w-4 h-4"></i>
                        </div>
                    </button>
                `;

                section.innerHTML = headerHtml;

                if (!isCollapsed) {
                    const grid = document.createElement('div');
                    grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3';

                    filteredItems.forEach(itemObj => {
                        const itemName = typeof itemObj === 'string' ? itemObj : itemObj.name;
                        const safeNameAttr = escapeHtmlAttr(itemName);
                        const isCustomizable = Boolean(group.customizable || (typeof itemObj === 'object' && itemObj.customizable));
                        const hasVariants = Boolean(typeof itemObj === 'object' && Array.isArray(itemObj.variants));

                        const card = document.createElement('div');
                        card.className = 'flex items-center justify-between px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-white hover:border-amber-300 hover:shadow-sm transition-all duration-150 gap-2';
                        card.dataset.itemCard = itemName;

                        if (hasVariants) {
                            // 先選品項、再選口味模式卡片
                            const variantTags = itemObj.optionGroups.map(g => g.options.join(' / ')).join(' ｜ ');
                            card.innerHTML = `
                                <button type="button" class="min-w-0 flex-1 text-left" onclick="openVariantModal('${safeNameAttr}')">
                                    <div class="font-medium text-slate-800 text-sm sm:text-base truncate">${itemName}</div>
                                    <div class="text-[11px] text-slate-400 truncate mt-0.5">${variantTags}</div></button>
                                <div class="flex items-center gap-2 shrink-0">
                                    <span 
                                        class="hidden text-xs font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-full select-none" 
                                        data-variant-badge="${safeNameAttr}"
                                    >已點 0</span>
                                    <button 
                                        type="button" 
                                        onclick="openVariantModal('${safeNameAttr}')"
                                        class="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 text-xs sm:text-sm font-bold hover:bg-amber-400 active:scale-95 transition shadow-sm flex items-center gap-1 select-none"
                                    >
                                        <span>${itemObj.buttonLabel || '口味'}</span>
                                        <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            `;
                        } else {
                            // 一般單一品項（含可重複出現在明細的鍋貼/水餃與三寶麵線）
                            const customBtnHtml = isCustomizable
                                ? `<button 
                                        type="button" 
                                        onclick="openCustomModal('${safeNameAttr}')"
                                        class="px-2 py-1 rounded-lg border border-amber-300 bg-amber-50 text-amber-800 text-xs font-bold hover:bg-amber-100 active:scale-95 transition shrink-0"
                                        title="客製化醋或沙茶"
                                   >客製</button>`
                                : '';

                            card.innerHTML = `
                                <div class="flex items-center gap-1.5 min-w-0">
                                    <span class="font-medium text-slate-800 text-sm sm:text-base select-none truncate">${itemName}</span>
                                    ${customBtnHtml}
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <button 
                                        type="button" 
                                        onclick="changeQuantity('${safeNameAttr}', -1)"
                                        class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg border border-slate-300 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 active:scale-90 transition disabled:opacity-30 disabled:pointer-events-none select-none"
                                        data-minus-btn="${safeNameAttr}"
                                        disabled
                                        aria-label="減少 ${safeNameAttr}"
                                    >
                                        <i data-lucide="minus" class="w-4 h-4"></i>
                                    </button>
                                    <span 
                                        class="w-6 text-center font-bold text-sm text-slate-700 select-none" 
                                        data-qty-display="${safeNameAttr}"
                                    >0</span>
                                    <button 
                                        type="button" 
                                        onclick="changeQuantity('${safeNameAttr}', 1)"
                                        class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center hover:bg-amber-400 active:scale-90 transition shadow-sm select-none"
                                        aria-label="增加 ${safeNameAttr}"
                                    >
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            `;
                        }

                        grid.appendChild(card);
                    });

                    section.appendChild(grid);
                }

                menuContainer.appendChild(section);
            });

            if (searchEmptyState) {
                searchEmptyState.classList.toggle('hidden', totalMatchedItems > 0);
            }
        }

        // ==========================================
        // 5A. 三寶麵線客製化彈窗操作邏輯
        // ==========================================
        window.openCustomModal = function(itemName, editingOrderId = null) {
            modalState.editingOrderId = editingOrderId;
            modalState.itemName = itemName;

            if (editingOrderId) {
                const orderList = getCurrentOrderList();
                const target = orderList.find(o => o.id === editingOrderId);
                if (target) {
                    const parts = target.note ? target.note.split('、') : [];
                    modalState.vinegar = parts.find(p => p.includes('醋')) || '';
                    modalState.shacha = parts.find(p => p.includes('沙茶')) || '';
                    modalState.qty = target.qty;
                }
            } else {
                modalState.vinegar = '';
                modalState.shacha = '';
                modalState.qty = 1;
            }

            modalItemTitle.textContent = itemName;
            modalQtyDisplay.textContent = modalState.qty;
            updateModalButtonsUI();
            customModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            safeIcons();
        };

        window.closeCustomModal = function() {
            customModal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        };

        window.changeModalQty = function(delta) {
            modalState.qty = Math.max(1, modalState.qty + delta);
            modalQtyDisplay.textContent = modalState.qty;
        };

        function updateModalButtonsUI() {
            document.querySelectorAll('.opt-btn').forEach(btn => {
                const group = btn.dataset.group;
                const val = btn.dataset.val;
                const isSelected = modalState[group] === val;

                if (isSelected) {
                    btn.className = 'opt-btn py-2.5 px-3 rounded-xl border-2 border-amber-500 bg-amber-50 text-amber-900 text-sm font-bold transition';
                } else {
                    btn.className = 'opt-btn py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition';
                }
            });
        }

        window.confirmCustomOrder = function() {
            const notes = [];
            if (modalState.vinegar) notes.push(modalState.vinegar);
            if (modalState.shacha) notes.push(modalState.shacha);
            const noteStr = notes.join('、');

            const orderList = getCurrentOrderList();
            const orderMap = storeOrderMaps[currentStoreId];

            let targetBag = currentBag; // 編輯既有明細時沿用原本的袋別
            if (modalState.editingOrderId) {
                const oldIdx = orderList.findIndex(o => o.id === modalState.editingOrderId);
                if (oldIdx > -1) { targetBag = orderList[oldIdx].bag; orderList.splice(oldIdx, 1); }
            }

            const sameItem = orderList.find(o => o.name === modalState.itemName && o.note === noteStr && o.bag === targetBag);
            if (sameItem) {
                sameItem.qty += modalState.qty;
            } else {
                orderList.push({
                    bag: targetBag,
                    id: 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: modalState.itemName,
                    note: noteStr,
                    qty: modalState.qty
                });
            }

            orderList.sort((a, b) => (orderMap.get(a.name) ?? 999) - (orderMap.get(b.name) ?? 999));

            closeCustomModal();
            renderStoreTabs();
            updateOrderUI();
        };

        // ==========================================
        // 5B. 先選品項、再選口味彈窗邏輯 (8方雲集整併品項)
        // ==========================================
        window.openVariantModal = function(baseName) {
            const config = findMenuItemConfig(baseName);
            if (!config || !config.variants) return;

            variantModalState.baseName = baseName;
            variantModalState.groups = config.itemObj.optionGroups;
            variantModalState.variants = config.variants;
            variantModalState.selected = config.itemObj.optionGroups.map(() => 0);
            variantModalState.qty = 1;

            variantModalTitle.textContent = baseName;
            variantQtyDisplay.textContent = '1';

            renderVariantOptionsUI();
            variantModal.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
            safeIcons();
        };

        window.closeVariantModal = function() {
            variantModal.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        };

        window.selectVariantOption = function(gi, oi) {
            variantModalState.selected[gi] = oi;
            renderVariantOptionsUI();
        };

        function getChosenVariant() {
            const sel = variantModalState.selected;
            return variantModalState.variants.find(v => v.combo.every((oi, i) => oi === sel[i]));
        }

        window.changeVariantQty = function(delta) {
            variantModalState.qty = Math.max(1, variantModalState.qty + delta);
            variantQtyDisplay.textContent = variantModalState.qty;
        };

        function renderVariantOptionsUI() {
            variantOptionsGrid.innerHTML = '';
            const multi = variantModalState.groups.length > 1;
            variantModalState.groups.forEach((group, gi) => {
                const wrap = document.createElement('div');
                const label = document.createElement('div');
                label.className = 'text-sm font-bold text-slate-700 mb-2';
                label.textContent = (multi ? `${gi + 1}. ` : '') + group.label + '：';
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 gap-2';
                group.options.forEach((opt, oi) => {
                    const isSelected = oi === variantModalState.selected[gi];
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.onclick = () => selectVariantOption(gi, oi);
                    btn.className = isSelected
                        ? 'py-2.5 px-3 rounded-xl border-2 border-amber-500 bg-amber-50 text-amber-900 text-sm font-bold transition text-center'
                        : 'py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-700 text-sm font-medium hover:bg-slate-50 transition text-center';
                    btn.textContent = opt;
                    grid.appendChild(btn);
                });
                wrap.append(label, grid);
                variantOptionsGrid.appendChild(wrap);
            });
            const chosen = getChosenVariant();
            variantPreview.textContent = chosen ? chosen.fullName : '';
        }

        window.confirmVariantOrder = function() {
            const chosenVariant = getChosenVariant();
            if (!chosenVariant) return;

            const fullName = chosenVariant.fullName;
            const orderList = getCurrentOrderList();
            const orderMap = storeOrderMaps[currentStoreId];

            const existingItem = orderList.find(item => item.name === fullName && !item.note && item.bag === currentBag);
            if (existingItem) {
                existingItem.qty += variantModalState.qty;
            } else {
                orderList.push({
                    bag: currentBag,
                    id: 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: fullName,
                    note: '',
                    qty: variantModalState.qty
                });
                orderList.sort((a, b) => (orderMap.get(a.name) ?? 999) - (orderMap.get(b.name) ?? 999));
            }

            closeVariantModal();
            renderStoreTabs();
            updateOrderUI();
        };

        // ==========================================
        // 6. 核心點餐邏輯 (支援鍋貼/水餃獨立重複新增)
        // ==========================================
        window.changeQuantity = function(itemName, delta) {
            try {
                const orderList = getCurrentOrderList();
                const orderMap = storeOrderMaps[currentStoreId];
                const config = findMenuItemConfig(itemName);
                const allowDuplicate = Boolean(config && config.allowDuplicateEntries);
                const initialQty = (config && config.defaultQty) ? config.defaultQty : 1;

                if (delta > 0) {
                    if (allowDuplicate) {
                        // 水餃跟鍋貼：每次點「+」皆建立獨立一筆明細，且預設基數為 5 顆起跳
                        orderList.push({
                    bag: currentBag,
                            id: 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                            name: itemName,
                            note: '',
                            qty: initialQty
                        });
                        orderList.sort((a, b) => (orderMap.get(a.name) ?? 999) - (orderMap.get(b.name) ?? 999));
                    } else {
                        // 其他一般品項：相同品名自動累加數量
                        const normalItem = orderList.find(item => item.name === itemName && !item.note && item.bag === currentBag);
                        if (normalItem) {
                            normalItem.qty += delta;
                        } else {
                            orderList.push({
                    bag: currentBag,
                                id: 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                                name: itemName,
                                note: '',
                                qty: delta
                            });
                            orderList.sort((a, b) => (orderMap.get(a.name) ?? 999) - (orderMap.get(b.name) ?? 999));
                        }
                    }
                } else {
                    // 按「-」優先扣除正常口味；若是可重複獨立品項則從該品項最後一筆扣除
                    let targetIndex = -1;
                    if (allowDuplicate) {
                        for (let i = orderList.length - 1; i >= 0; i--) {
                            if (orderList[i].name === itemName && orderList[i].bag === currentBag) {
                                targetIndex = i;
                                break;
                            }
                        }
                    } else {
                        targetIndex = orderList.findIndex(item => item.name === itemName && !item.note && item.bag === currentBag);
                        if (targetIndex === -1) {
                            for (let i = orderList.length - 1; i >= 0; i--) {
                                if (orderList[i].name === itemName) {
                                    targetIndex = i;
                                    break;
                                }
                            }
                        }
                    }

                    // 目前這袋沒有時，改扣其他袋的同品項
                    if (targetIndex === -1) {
                        for (let i = orderList.length - 1; i >= 0; i--) {
                            if (orderList[i].name === itemName) { targetIndex = i; break; }
                        }
                    }

                    if (targetIndex > -1) {
                        const newQty = orderList[targetIndex].qty + delta;
                        if (newQty <= 0) {
                            orderList.splice(targetIndex, 1);
                        } else {
                            orderList[targetIndex].qty = newQty;
                        }
                    }
                }

                renderStoreTabs();
                updateOrderUI();
            } catch (error) {
                console.error('更新餐點數量時發生錯誤:', error);
            }
        };

        // 針對右側明細特定列調整數量（水餃、鍋貼可針對個別筆數單獨調整顆數）
        window.changeOrderRowQty = function(orderId, delta) {
            const orderList = getCurrentOrderList();
            const idx = orderList.findIndex(item => item.id === orderId);
            if (idx === -1) return;

            const newQty = orderList[idx].qty + delta;
            if (newQty <= 0) {
                orderList.splice(idx, 1);
            } else {
                orderList[idx].qty = newQty;
            }
            renderStoreTabs();
            updateOrderUI();
        };

        // 移除單一明細列
        window.removeOrderRow = function(orderId) {
            storeOrders[currentStoreId] = getCurrentOrderList().filter(item => item.id !== orderId);
            renderStoreTabs();
            updateOrderUI();
        };

let clearArmTimer = null;
        function resetClearBtn() {
            clearTimeout(clearArmTimer);
            clearArmTimer = null;
            clearBtn.querySelector('span').textContent = '清空';
        }

        function clearAllOrders() {
            // 防誤觸：第一次點擊先進入確認狀態，3 秒內再按一次才清空
            if (getCurrentOrderList().length === 0) return;
            if (!clearArmTimer) {
                clearBtn.querySelector('span').textContent = '再按一次清空';
                clearArmTimer = setTimeout(resetClearBtn, 3000);
                return;
            }
            resetClearBtn();
            const orderList = getCurrentOrderList();
            if (orderList.length === 0) return;
            storeOrders[currentStoreId] = [];
            renderStoreTabs();
            updateOrderUI();
            showToast(`已清空「${getCurrentStore().shortName}」的點餐紀錄`);
        }

        // ==========================================
        // 7. 同步更新畫面 (菜單數量、右側明細、輸出文字)
        // ==========================================
        function updateOrderUI() {
            const orderList = getCurrentOrderList();
            renderBagSwitcher();

            // 1A. 更新左側一般菜單品項的總份數與按鈕狀態
            const allQtyDisplays = document.querySelectorAll('[data-qty-display]');
            allQtyDisplays.forEach(el => {
                const name = el.dataset.qtyDisplay;
                const totalForItem = orderList
                    .filter(item => item.name === name)
                    .reduce((sum, item) => sum + item.qty, 0);
                
                el.textContent = totalForItem;
                
                const minusBtn = document.querySelector(`[data-minus-btn="${CSS.escape(name)}"]`);
                const card = document.querySelector(`[data-item-card="${CSS.escape(name)}"]`);
                
                if (minusBtn) minusBtn.disabled = totalForItem === 0;
                if (card) {
                    if (totalForItem > 0) {
                        card.classList.add('border-amber-400', 'bg-amber-50/40');
                        card.classList.remove('border-slate-200', 'bg-slate-50/50');
                    } else {
                        card.classList.remove('border-amber-400', 'bg-amber-50/40');
                        card.classList.add('border-slate-200', 'bg-slate-50/50');
                    }
                }
            });

            // 1B. 更新左側「先選品項、再選口味」整併卡片的已點徽章狀態
            const allVariantBadges = document.querySelectorAll('[data-variant-badge]');
            allVariantBadges.forEach(badge => {
                const baseName = badge.dataset.variantBadge;
                const config = findMenuItemConfig(baseName);
                const card = document.querySelector(`[data-item-card="${CSS.escape(baseName)}"]`);
                if (!config || !config.variants) return;

                const variantNames = new Set(config.variants.map(v => v.fullName));
                const totalForGroup = orderList
                    .filter(item => variantNames.has(item.name))
                    .reduce((sum, item) => sum + item.qty, 0);

                if (totalForGroup > 0) {
                    badge.textContent = `已點 ${totalForGroup}`;
                    badge.classList.remove('hidden');
                    if (card) {
                        card.classList.add('border-amber-400', 'bg-amber-50/40');
                        card.classList.remove('border-slate-200', 'bg-slate-50/50');
                    }
                } else {
                    badge.classList.add('hidden');
                    if (card) {
                        card.classList.remove('border-amber-400', 'bg-amber-50/40');
                        card.classList.add('border-slate-200', 'bg-slate-50/50');
                    }
                }
            });

            // 2. 計算當前餐廳總份數並同步更新分類膠囊徽章與手機底部懸浮列
            const totalQty = orderList.reduce((sum, item) => sum + item.qty, 0);
            totalCountBadge.textContent = `共 ${totalQty} 份`;
            renderCategoryNav();

            if (mobileBarSummary) {
                if (totalQty === 0) {
                    mobileBarSummary.textContent = '尚未選擇餐點';
                } else {
                    mobileBarSummary.textContent = `已點 ${orderList.length} 筆明細，共 ${totalQty} 份`;
                }
            }

            // 3. 更新右側互動明細列表
            if (orderList.length === 0) {
                emptyState.classList.remove('hidden');
                orderItemsList.classList.add('hidden');
                copyBtn.disabled = true;
                clearBtn.disabled = true;
            } else {
                emptyState.classList.add('hidden');
                orderItemsList.classList.remove('hidden');
                copyBtn.disabled = false;
                clearBtn.disabled = false;

                orderItemsList.innerHTML = '';
                const viewList = getOrdersByBag(orderList);
                const showBagHeaders = bagHeaderNeeded(orderList);
                let lastBag = -1;
                viewList.forEach((item, index) => {
                    if (showBagHeaders && item.bag !== lastBag) {
                        const bagQty = orderList.filter(o => o.bag === item.bag).reduce((sum, o) => sum + o.qty, 0);
                        const header = document.createElement('li');
                        header.className = 'pt-1 flex items-center gap-2 text-xs font-bold text-slate-500';
                        header.innerHTML = `<span class="px-2 py-0.5 rounded-md ${BAG_STYLES[item.bag]}">${BAGS[item.bag]}</span><span>共 ${bagQty} 份</span>`;
                        orderItemsList.appendChild(header);
                    }
                    lastBag = item.bag;
                    const config = findMenuItemConfig(item.name);
                    const canCustomize = Boolean(config && config.customizable);
                    const safeItemNameAttr = escapeHtmlAttr(item.name);
                    const noteBadgeHtml = item.note
                        ? `<span class="inline-block mt-0.5 text-xs font-semibold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-md">${escapeHtmlAttr(item.note)}</span>`
                        : '';
                    const editBtnHtml = canCustomize
                        ? `<button type="button" onclick="openCustomModal('${safeItemNameAttr}', '${item.id}')" class="text-slate-400 hover:text-amber-600 p-1 rounded-lg transition" title="調整客製口味"><i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i></button>`
                        : '';

                    const nextBagName = BAGS[(item.bag + 1) % BAGS.length];
                    const bagBtnHtml = `<button type="button" onclick="cycleOrderBag('${item.id}')" class="text-slate-400 hover:text-amber-600 p-1 rounded-lg transition" title="換到「${nextBagName}」" aria-label="換到${nextBagName}"><i data-lucide="arrow-right-left" class="w-3.5 h-3.5"></i></button>`;
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 text-sm gap-2';
                    li.innerHTML = `
                        <div class="flex items-start gap-2.5 min-w-0">
                            
                            <div class="min-w-0">
                                <div class="font-medium text-slate-800 truncate">${escapeHtmlAttr(item.name)}</div>
                                ${noteBadgeHtml}
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${editBtnHtml}${bagBtnHtml}
                            <button type="button" onclick="changeOrderRowQty('${item.id}', -1)" class="w-8 h-8 sm:w-7 sm:h-7 rounded-md border border-slate-300 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 text-xs font-bold">-</button>
                            <span class="font-bold text-amber-600 bg-amber-100/70 px-2 py-0.5 rounded-md min-w-[2.2rem] text-center">
                                x${item.qty}
                            </span>
                            <button type="button" onclick="changeOrderRowQty('${item.id}', 1)" class="w-8 h-8 sm:w-7 sm:h-7 rounded-md border border-slate-300 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 text-xs font-bold">+</button>
                            <button 
                                type="button" 
                                onclick="removeOrderRow('${item.id}')" 
                                class="text-slate-400 hover:text-rose-500 p-1 rounded-lg transition"
                                title="刪除此品項"
                            >
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    orderItemsList.appendChild(li);
                });
                safeIcons();
            }

            // 4. 更新純文字輸出區
            updateOutputText();
        }

        function updateOutputText() {
            const orderList = getCurrentOrderList();
            if (orderList.length === 0) {
                outputTextarea.value = '';
                return;
            }

            const fmt = item => {
                const base = `${item.name} x${item.qty}`;
                return item.note ? `${base}，${item.note}` : base;
            };
            const sorted = getOrdersByBag(orderList);
            if (!bagHeaderNeeded(orderList)) {
                outputTextarea.value = sorted.map(fmt).join('\n');
                return;
            }
            const lines = [];
            let lastBag = -1;
            sorted.forEach(item => {
                if (item.bag !== lastBag) { lines.push(`【${BAGS[item.bag]}】`); lastBag = item.bag; }
                lines.push(fmt(item));
            });
            outputTextarea.value = lines.join('\n');
        }

        // ==========================================
        // 8. 複製功能
        // ==========================================
        async function copyOrderToClipboard() {
            const orderList = getCurrentOrderList();
            if (orderList.length === 0) return;

            const textToCopy = outputTextarea.value;
            const storeName = getCurrentStore().shortName;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textToCopy);
                    showToast(`已複製「${storeName}」點餐明細！`);
                } else {
                    fallbackCopyText(textToCopy, storeName);
                }
            } catch (err) {
                fallbackCopyText(textToCopy, storeName);
            }
        }

        function fallbackCopyText(text, storeName) {
            try {
                outputTextarea.select();
                outputTextarea.setSelectionRange(0, 99999);
                const successful = document.execCommand('copy');
                window.getSelection().removeAllRanges();

                if (successful) {
                    showToast(`已複製「${storeName}」點餐明細！`);
                } else {
                    showToast('複製失敗，請手動全選複製');
                }
            } catch (err) {
                console.error('複製失敗:', err);
                showToast('複製失敗，請手動全選複製');
            }
        }

        window.copyStoreUrl = async function() {
            const store = getCurrentStore();
            let shareUrl = '';

            try {
                if (window.location.protocol === 'blob:') {
                    shareUrl = `?store=${store.paramCode}`;
                } else {
                    const url = new URL(window.location.href);
                    url.search = `?store=${store.paramCode}`;
                    url.hash = '';
                    shareUrl = url.toString();
                }

                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(shareUrl);
                    showToast(`已複製「${store.shortName}」專屬網址 (?store=${store.paramCode})`);
                } else {
                    copyRawTextFallback(shareUrl, `已複製「${store.shortName}」專屬網址 (?store=${store.paramCode})`);
                }
            } catch (err) {
                copyRawTextFallback(shareUrl, `已複製「${store.shortName}」專屬網址`);
            }
        };

        function copyRawTextFallback(text, successMsg) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showToast(successMsg);
            } catch (e) {
                showToast('複製失敗，請手動複製網址列');
            }
            document.body.removeChild(tempInput);
        }

        function showToast(message) {
            toastMsgEl.textContent = message;
            toastEl.classList.remove('translate-y-24', 'opacity-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
