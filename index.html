<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 禁止手機端雙擊放大或雙指縮放，防止快速點餐時畫面跳動 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>簡易點餐系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (Noto Sans TC 與 Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <style>
        /* 全域鎖定觸控行為為 manipulation，徹底消除行動端瀏覽器 300ms 點擊延遲與連點縮放 */
        html, body, button {
            touch-action: manipulation;
        }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        /* 自訂捲軸樣式，讓明細區域更美觀 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 頂部導覽列與餐廳切換頁籤 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-3 pb-2.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5">
            <!-- 動態餐廳標題與獨立網址分享按鈕 -->
            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5">
                    <div class="bg-amber-500 text-white p-2 rounded-xl shadow-sm">
                        <i data-lucide="utensils" class="w-5 h-5"></i>
                    </div>
                    <h1 id="header-title" class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">
                        香村簡易點餐系統
                    </h1>
                </div>
                <button
                    type="button"
                    onclick="copyStoreUrl()"
                    class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-600 text-xs font-medium hover:bg-slate-100 hover:text-slate-900 active:scale-95 transition shrink-0"
                    title="複製此餐廳的專屬獨立網址"
                >
                    <i data-lucide="link" class="w-3.5 h-3.5 text-amber-600"></i>
                    <span>複製網址</span>
                </button>
            </div>

            <!-- 餐廳切換頁籤容器 (獨立模式下自動隱藏) -->
            <nav id="store-tabs" class="flex items-center gap-2 overflow-x-auto pb-0.5 sm:pb-0" aria-label="餐廳選擇">
                <!-- 頁籤將透過 JavaScript 動態渲染 -->
            </nav>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- 左側：菜單選擇區 (佔 7 欄) -->
            <div class="lg:col-span-7 space-y-6" id="menu-container">
                <!-- 菜單分類將透過 JavaScript 動態渲染於此 -->
            </div>

            <!-- 右側：點餐明細與輸出區 (佔 5 欄，在桌機版固定於上方) -->
            <div class="lg:col-span-5 lg:sticky lg:top-24 space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <!-- 明細標題列 -->
                    <div class="p-4 sm:p-5 bg-slate-900 text-white flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="receipt" class="w-5 h-5 text-amber-400"></i>
                            <h2 id="order-panel-title" class="font-bold text-base sm:text-lg">點餐明細（依菜單順序）</h2>
                        </div>
                        <span id="total-count-badge" class="bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-full shrink-0">
                            共 0 份
                        </span>
                    </div>

                    <!-- 互動式明細列表 -->
                    <div class="p-4 sm:p-5 max-h-[40vh] overflow-y-auto border-b border-slate-100" id="order-list-container">
                        <!-- 空白狀態 -->
                        <div id="empty-state" class="py-10 text-center text-slate-400 flex flex-col items-center justify-center">
                            <i data-lucide="clipboard-list" class="w-12 h-12 mb-3 text-slate-300 stroke-[1.5]"></i>
                            <p class="text-sm font-medium text-slate-500">尚未選擇任何餐點</p>
                            <p class="text-xs mt-1">請從左側菜單點擊「+」或「客製」開始點餐</p>
                        </div>
                        
                        <!-- 訂單項目列表 -->
                        <ul id="order-items-list" class="space-y-2.5 hidden">
                            <!-- 動態產生項目 -->
                        </ul>
                    </div>

                    <!-- 純文字輸出預覽區 -->
                    <div class="p-4 sm:p-5 bg-slate-50 space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="output-textarea" class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                                輸出格式預覽 (品項 x數量)
                            </label>
                        </div>
                        
                        <!-- font-size 設為 16px (text-base)，防止 iOS Safari 點擊輸入框時自動放大畫面 -->
                        <textarea 
                            id="output-textarea" 
                            rows="6" 
                            readonly 
                            placeholder="點餐後的文字明細將顯示在這裡..."
                            class="w-full rounded-xl border border-slate-200 bg-white p-3 text-base text-slate-700 font-mono focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none shadow-inner"
                        ></textarea>

                        <!-- 操作按鈕群 -->
                        <div class="grid grid-cols-3 gap-2.5 pt-1">
                            <button 
                                id="clear-btn" 
                                type="button"
                                class="col-span-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 hover:text-slate-900 active:scale-[0.98] transition disabled:opacity-40 disabled:pointer-events-none"
                                disabled
                            >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                <span>清空</span>
                            </button>
                            <button 
                                id="copy-btn" 
                                type="button"
                                class="col-span-2 flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-xl bg-amber-500 text-slate-950 text-sm font-bold hover:bg-amber-400 active:scale-[0.98] transition shadow-sm disabled:opacity-40 disabled:pointer-events-none"
                                disabled
                            >
                                <i data-lucide="copy" class="w-4 h-4"></i>
                                <span>複製點餐明細</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 提示訊息 Toast (取代 alert) -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5 text-sm font-medium border border-slate-700">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
            <span id="toast-message">已複製到剪貼簿！</span>
        </div>
    </div>

    <!-- 單一品項客製化彈窗 Modal (三寶麵線專用：醋、沙茶) -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <!-- Modal 標題 -->
            <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
                <div>
                    <span class="text-xs text-amber-400 font-semibold block">單品口味客製化</span>
                    <h3 id="modal-item-title" class="text-lg font-bold mt-0.5">大腸麵線(大)</h3>
                </div>
                <button type="button" onclick="closeCustomModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Modal 選項內容 -->
            <div class="p-5 space-y-5">
                <!-- 醋選項 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">黑醋調整</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="vinegar" data-val="">正常</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="vinegar" data-val="醋多">醋多</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="vinegar" data-val="不要醋">不要醋</button>
                    </div>
                </div>

                <!-- 沙茶選項 -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">沙茶調整</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="shacha" data-val="">正常</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="shacha" data-val="沙茶多">沙茶多</button>
                        <button type="button" class="opt-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition" data-group="shacha" data-val="不要沙茶">不要沙茶</button>
                    </div>
                </div>

                <!-- 份數調整 -->
                <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                    <span class="text-sm font-bold text-slate-700">此客製口味份數</span>
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="changeModalQty(-1)" class="w-9 h-9 rounded-lg border border-slate-300 bg-white text-slate-700 flex items-center justify-center hover:bg-slate-100 active:scale-90 transition">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                        <span id="modal-qty-display" class="w-6 text-center font-bold text-base text-slate-900">1</span>
                        <button type="button" onclick="changeModalQty(1)" class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center hover:bg-amber-400 active:scale-90 transition">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Modal 底部按鈕 -->
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-2.5">
                <button type="button" onclick="closeCustomModal()" class="px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 transition">
                    取消
                </button>
                <button type="button" onclick="confirmCustomOrder()" class="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 text-sm font-bold hover:bg-amber-400 shadow-sm transition">
                    確認加入
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 多餐廳菜單資料庫 (設定專屬數字代碼 paramCode：香村=1, 三寶麵線=3)
        // ==========================================
        const STORES_DATA = [
            {
                id: "xiangcun",
                paramCode: "1",
                shortName: "香村",
                title: "香村簡易點餐系統",
                menu: [
                    {
                        category: "火鍋",
                        icon: "flame",
                        color: "text-rose-500",
                        bgBadge: "bg-rose-50",
                        items: [
                            "韓式泡菜鍋",
                            "海鮮豆腐鍋",
                            "沙茶牛肉鍋",
                            "沙茶羊肉鍋",
                            "經典泡菜鍋",
                            "沙茶豬肉鍋",
                            "單點白飯"
                        ]
                    },
                    {
                        category: "炒飯",
                        icon: "utensils-crossed",
                        color: "text-amber-600",
                        bgBadge: "bg-amber-50",
                        items: [
                            "沙茶牛肉炒飯",
                            "沙茶豬肉炒飯",
                            "泡菜炒飯",
                            "鹹豬肉炒飯",
                            "蒜香炒飯",
                            "蝦仁炒飯"
                        ]
                    },
                    {
                        category: "炒麵",
                        icon: "soup",
                        color: "text-orange-500",
                        bgBadge: "bg-orange-50",
                        items: [
                            "沙茶牛肉炒麵",
                            "沙茶豬肉炒麵",
                            "海鮮炒麵",
                            "麻油手工麵線"
                        ]
                    },
                    {
                        category: "湯品",
                        icon: "cup-soda",
                        color: "text-emerald-600",
                        bgBadge: "bg-emerald-50",
                        items: [
                            "蚵仔湯",
                            "薑絲蛤蜊湯",
                            "貢丸湯",
                            "紫菜蛋花湯",
                            "豆腐湯"
                        ]
                    }
                ]
            },
            {
                id: "sanbao",
                paramCode: "3",
                shortName: "三寶麵線",
                title: "三寶麵線簡易點餐系統",
                menu: [
                    {
                        category: "麵線",
                        icon: "soup",
                        color: "text-amber-600",
                        bgBadge: "bg-amber-50",
                        customizable: true, // 整類開啟醋/沙茶客製化
                        items: [
                            "大腸麵線(大)",
                            "大腸麵線(小)",
                            "肉羹麵線(大)",
                            "肉羹麵線(小)",
                            "蚵仔麵線(大)",
                            "蚵仔麵線(小)",
                            "三寶麵線(大)",
                            "三寶麵線(小)",
                            "清麵線(大)",
                            "清麵線(小)"
                        ]
                    },
                    {
                        category: "香菇肉羹 / 飯",
                        icon: "utensils-crossed",
                        color: "text-orange-500",
                        bgBadge: "bg-orange-50",
                        items: [
                            { name: "香菇肉羹麵", customizable: true },
                            { name: "香菇肉羹飯", customizable: true },
                            { name: "香菇肉羹米粉", customizable: true },
                            { name: "香菇肉羹湯(大)", customizable: true },
                            { name: "香菇肉羹湯(小)", customizable: true },
                            "滷肉飯(大)",
                            "滷肉飯(小)"
                        ]
                    },
                    {
                        category: "小菜",
                        icon: "salad",
                        color: "text-emerald-600",
                        bgBadge: "bg-emerald-50",
                        items: [
                            "燙青菜",
                            "皮蛋豆腐",
                            "滷大腸",
                            "海帶",
                            "豆干",
                            "蒜泥白肉"
                        ]
                    }
                ]
            }
        ];

        // ==========================================
        // 2. 狀態管理與多店獨立儲存空間
        // ==========================================
        let currentStoreId = STORES_DATA[0].id;
        let isSoloMode = false;

        // 為每家餐廳建立獨立的訂單陣列與菜單順序索引 Map
        const storeOrders = {};     // 格式: { xiangcun: [...], sanbao: [...] }
        const storeOrderMaps = {};  // 格式: { xiangcun: Map, sanbao: Map }

        STORES_DATA.forEach(store => {
            storeOrders[store.id] = [];
            const orderMap = new Map();
            store.menu.flatMap(group => group.items).forEach((itemObj, index) => {
                const name = typeof itemObj === 'string' ? itemObj : itemObj.name;
                orderMap.set(name, index);
            });
            storeOrderMaps[store.id] = orderMap;
        });

        let toastTimeout = null;

        // 客製化彈窗狀態
        let modalState = {
            editingOrderId: null, // 若為 null 代表新增，若有值代表編輯既有明細列
            itemName: '',
            vinegar: '',
            shacha: '',
            qty: 1
        };

        // ==========================================
        // 3. DOM 元素參照
        // ==========================================
        const headerTitle = document.getElementById('header-title');
        const storeTabs = document.getElementById('store-tabs');
        const menuContainer = document.getElementById('menu-container');
        const orderItemsList = document.getElementById('order-items-list');
        const emptyState = document.getElementById('empty-state');
        const outputTextarea = document.getElementById('output-textarea');
        const totalCountBadge = document.getElementById('total-count-badge');
        const copyBtn = document.getElementById('copy-btn');
        const clearBtn = document.getElementById('clear-btn');
        const toastEl = document.getElementById('toast');
        const toastMsgEl = document.getElementById('toast-message');
        const customModal = document.getElementById('custom-modal');
        const modalItemTitle = document.getElementById('modal-item-title');
        const modalQtyDisplay = document.getElementById('modal-qty-display');

        // 圖示庫載入失敗時不可中斷點餐流程
        function safeIcons() {
            try { if (window.lucide) window.lucide.createIcons(); } catch (e) { console.warn('lucide error', e); }
        }

        function getCurrentStore() {
            return STORES_DATA.find(s => s.id === currentStoreId) || STORES_DATA[0];
        }

        function getCurrentOrderList() {
            return storeOrders[currentStoreId];
        }

        // 依據網址參數或 Hash 解析目標餐廳（支援 ?store=1、?store=3、?s=1、#1、#3 或原本的 id）
        function resolveStoreFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            const rawParam = urlParams.get('store') || urlParams.get('s') || window.location.hash.replace('#', '');
            if (!rawParam) return null;

            const matched = STORES_DATA.find(s => s.paramCode === rawParam || s.id === rawParam);
            return matched ? matched.id : null;
        }

        // ==========================================
        // 4. 初始化與渲染函數
        // ==========================================
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetStoreId = resolveStoreFromUrl();

            // 當網址帶有指定餐廳參數（如 ?store=1 或 ?store=3）或明確指定 ?solo=1 時，預設啟用獨立模式；若 ?solo=0 則強制顯示切換列
            const soloParam = urlParams.get('solo');
            if (soloParam === '0') {
                isSoloMode = false;
            } else if (soloParam === '1' || targetStoreId !== null) {
                isSoloMode = true;
            }

            if (targetStoreId) {
                currentStoreId = targetStoreId;
            }

            // 監聽瀏覽器上一頁 / 下一頁或手動修改 Hash
            window.addEventListener('hashchange', () => {
                const nextStoreId = resolveStoreFromUrl();
                if (nextStoreId && nextStoreId !== currentStoreId) {
                    switchStore(nextStoreId, false);
                }
            });

            // 綁定彈窗選項按鈕點擊事件
            document.querySelectorAll('.opt-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const group = btn.dataset.group;
                    const val = btn.dataset.val;
                    modalState[group] = val;
                    updateModalButtonsUI();
                });
            });

            // 點擊 Modal 背景關閉
            if (customModal) {
                customModal.addEventListener('click', (e) => {
                    if (e.target === customModal) closeCustomModal();
                });
            }

            switchStore(currentStoreId, false);

            copyBtn.addEventListener('click', copyOrderToClipboard);
            clearBtn.addEventListener('click', clearAllOrders);
        }

        window.switchStore = function(storeId, updateUrl = true) {
            currentStoreId = storeId;
            const store = getCurrentStore();

            document.title = store.title;
            headerTitle.textContent = store.title;

            if (updateUrl) {
                try {
                    if (window.location.protocol !== 'blob:') {
                        // 同步更新網址參數與 Hash 為數字代碼 (1 或 3)
                        const url = new URL(window.location.href);
                        url.searchParams.set('store', store.paramCode);
                        window.history.replaceState({}, '', url.toString());
                    }
                } catch (e) {}
            }

            renderStoreTabs();
            renderMenu();
            updateOrderUI();
            safeIcons();
        };

        function renderStoreTabs() {
            // 獨立模式下隱藏頂部餐廳切換列，避免誤觸切換到其他店家
            if (isSoloMode) {
                storeTabs.classList.add('hidden');
                return;
            }
            storeTabs.classList.remove('hidden');
            storeTabs.innerHTML = '';

            STORES_DATA.forEach(store => {
                const isActive = store.id === currentStoreId;
                const storeTotalQty = storeOrders[store.id].reduce((sum, item) => sum + item.qty, 0);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => switchStore(store.id);
                
                btn.className = isActive
                    ? 'flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold shadow-sm transition shrink-0'
                    : 'flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-100 text-slate-600 text-sm font-medium hover:bg-slate-200 hover:text-slate-900 transition shrink-0';

                const badgeHtml = storeTotalQty > 0
                    ? `<span class="px-1.5 py-0.2 rounded-full text-xs font-bold ${isActive ? 'bg-amber-500 text-slate-950' : 'bg-amber-200 text-amber-900'}">${storeTotalQty}</span>`
                    : '';

                btn.innerHTML = `
                    <span>${store.shortName}</span>
                    ${badgeHtml}
                `;
                storeTabs.appendChild(btn);
            });
        }

        // 渲染當前餐廳左側菜單卡片
        function renderMenu() {
            const store = getCurrentStore();
            menuContainer.innerHTML = '';

            store.menu.forEach(group => {
                const section = document.createElement('section');
                section.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5';

                const headerHtml = `
                    <div class="flex items-center gap-2 mb-4 pb-2.5 border-b border-slate-100">
                        <div class="p-1.5 rounded-lg ${group.bgBadge} ${group.color}">
                            <i data-lucide="${group.icon}" class="w-5 h-5"></i>
                        </div>
                        <h3 class="font-bold text-base sm:text-lg text-slate-800">${group.category}</h3>
                    </div>
                `;

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';

                group.items.forEach(itemObj => {
                    const itemName = typeof itemObj === 'string' ? itemObj : itemObj.name;
                    const isCustomizable = Boolean(group.customizable || (typeof itemObj === 'object' && itemObj.customizable));

                    const card = document.createElement('div');
                    card.className = 'flex items-center justify-between p-3 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-white hover:border-amber-300 hover:shadow-sm transition-all duration-150 gap-2';
                    card.dataset.itemCard = itemName;

                    const customBtnHtml = isCustomizable
                        ? `<button 
                                type="button" 
                                onclick="openCustomModal('${itemName}')"
                                class="px-2 py-1 rounded-lg border border-amber-300 bg-amber-50 text-amber-800 text-xs font-bold hover:bg-amber-100 active:scale-95 transition shrink-0"
                                title="客製化醋或沙茶"
                           >客製</button>`
                        : '';

                    card.innerHTML = `
                        <div class="flex items-center gap-1.5 min-w-0">
                            <span class="font-medium text-slate-800 text-sm sm:text-base select-none truncate">${itemName}</span>
                            ${customBtnHtml}
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button 
                                type="button" 
                                onclick="changeQuantity('${itemName}', -1)"
                                class="w-9 h-9 rounded-lg border border-slate-300 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 active:scale-90 transition disabled:opacity-30 disabled:pointer-events-none select-none"
                                data-minus-btn="${itemName}"
                                disabled
                                aria-label="減少 ${itemName}"
                            >
                                <i data-lucide="minus" class="w-4 h-4"></i>
                            </button>
                            <span 
                                class="w-6 text-center font-bold text-sm text-slate-700 select-none" 
                                data-qty-display="${itemName}"
                            >0</span>
                            <button 
                                type="button" 
                                onclick="changeQuantity('${itemName}', 1)"
                                class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center hover:bg-amber-400 active:scale-90 transition shadow-sm select-none"
                                aria-label="增加 ${itemName}"
                            >
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.innerHTML = headerHtml;
                section.appendChild(grid);
                menuContainer.appendChild(section);
            });
        }

        // ==========================================
        // 5. 客製化彈窗操作邏輯
        // ==========================================
        window.openCustomModal = function(itemName, editingOrderId = null) {
            modalState.editingOrderId = editingOrderId;
            modalState.itemName = itemName;

            if (editingOrderId) {
                const orderList = getCurrentOrderList();
                const target = orderList.find(o => o.id === editingOrderId);
                if (target) {
                    const parts = target.note ? target.note.split('、') : [];
                    modalState.vinegar = parts.find(p => p.includes('醋')) || '';
                    modalState.shacha = parts.find(p => p.includes('沙茶')) || '';
                    modalState.qty = target.qty;
                }
            } else {
                modalState.vinegar = '';
                modalState.shacha = '';
                modalState.qty = 1;
            }

            modalItemTitle.textContent = itemName;
            modalQtyDisplay.textContent = modalState.qty;
            updateModalButtonsUI();
            customModal.classList.remove('hidden');
            safeIcons();
        };

        window.closeCustomModal = function() {
            customModal.classList.add('hidden');
        };

        window.changeModalQty = function(delta) {
            modalState.qty = Math.max(1, modalState.qty + delta);
            modalQtyDisplay.textContent = modalState.qty;
        };

        function updateModalButtonsUI() {
            document.querySelectorAll('.opt-btn').forEach(btn => {
                const group = btn.dataset.group;
                const val = btn.dataset.val;
                const isSelected = modalState[group] === val;

                if (isSelected) {
                    btn.className = 'opt-btn py-2.5 px-3 rounded-xl border-2 border-amber-500 bg-amber-50 text-amber-900 text-sm font-bold transition';
                } else {
                    btn.className = 'opt-btn py-2.5 px-3 rounded-xl border border-slate-200 bg-white text-slate-600 text-sm font-medium hover:bg-slate-50 transition';
                }
            });
        }

        window.confirmCustomOrder = function() {
            const notes = [];
            if (modalState.vinegar) notes.push(modalState.vinegar);
            if (modalState.shacha) notes.push(modalState.shacha);
            const noteStr = notes.join('、');

            const orderList = getCurrentOrderList();
            const orderMap = storeOrderMaps[currentStoreId];

            if (modalState.editingOrderId) {
                // 編輯既有項目：先移除舊項目，再依新條件合併或插入
                const oldIdx = orderList.findIndex(o => o.id === modalState.editingOrderId);
                if (oldIdx > -1) orderList.splice(oldIdx, 1);
            }

            // 檢查是否已有「相同品名 + 相同客製備註」的項目，若有則自動合併數量
            const sameItem = orderList.find(o => o.name === modalState.itemName && o.note === noteStr);
            if (sameItem) {
                sameItem.qty += modalState.qty;
            } else {
                orderList.push({
                    id: 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name: modalState.itemName,
                    note: noteStr,
                    qty: modalState.qty
                });
            }

            // 依照菜單原始順序排列
            orderList.sort((a, b) => (orderMap.get(a.name) ?? 999) - (orderMap.get(b.name) ?? 999));

            closeCustomModal();
            renderStoreTabs();
            updateOrderUI();
        };

        // ==========================================
        // 6. 核心點餐邏輯 (針對當前餐廳操作)
        // ==========================================
        window.changeQuantity = function(itemName, delta) {
            try {
                const orderList = getCurrentOrderList();
                const orderMap = storeOrderMaps[currentStoreId];

                if (delta > 0) {
                    // 快速按「+」預設加入無客製化（正常口味）項目
                    const normalItem = orderList.find(item => item.name === itemName && !item.note);
                    if (normalItem) {
                        normalItem.qty += delta;
                    } else {
                        orderList.push({
                            id: 'ord_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                            name: itemName,
                            note: '',
                            qty: delta
                        });
                        orderList.sort((a, b) => (orderMap.get(a.name) ?? 999) - (orderMap.get(b.name) ?? 999));
                    }
                } else {
                    // 按「-」優先扣除正常口味；若無正常口味則從該品項最後一筆客製項目扣除
                    let targetIndex = orderList.findIndex(item => item.name === itemName && !item.note);
                    if (targetIndex === -1) {
                        for (let i = orderList.length - 1; i >= 0; i--) {
                            if (orderList[i].name === itemName) {
                                targetIndex = i;
                                break;
                            }
                        }
                    }
                    if (targetIndex > -1) {
                        const newQty = orderList[targetIndex].qty + delta;
                        if (newQty <= 0) {
                            orderList.splice(targetIndex, 1);
                        } else {
                            orderList[targetIndex].qty = newQty;
                        }
                    }
                }

                renderStoreTabs();
                updateOrderUI();
            } catch (error) {
                console.error('更新餐點數量時發生錯誤:', error);
            }
        };

        // 針對右側明細特定列調整數量
        window.changeOrderRowQty = function(orderId, delta) {
            const orderList = getCurrentOrderList();
            const idx = orderList.findIndex(item => item.id === orderId);
            if (idx === -1) return;

            const newQty = orderList[idx].qty + delta;
            if (newQty <= 0) {
                orderList.splice(idx, 1);
            } else {
                orderList[idx].qty = newQty;
            }
            renderStoreTabs();
            updateOrderUI();
        };

        // 移除單一明細列
        window.removeOrderRow = function(orderId) {
            storeOrders[currentStoreId] = getCurrentOrderList().filter(item => item.id !== orderId);
            renderStoreTabs();
            updateOrderUI();
        };

        function clearAllOrders() {
            const orderList = getCurrentOrderList();
            if (orderList.length === 0) return;
            storeOrders[currentStoreId] = [];
            renderStoreTabs();
            updateOrderUI();
            showToast(`已清空「${getCurrentStore().shortName}」的點餐紀錄`);
        }

        // ==========================================
        // 7. 同步更新畫面 (菜單數量、右側明細、輸出文字)
        // ==========================================
        function isItemCustomizableInCurrentStore(itemName) {
            const store = getCurrentStore();
            for (const group of store.menu) {
                for (const item of group.items) {
                    const name = typeof item === 'string' ? item : item.name;
                    if (name === itemName) {
                        return Boolean(group.customizable || (typeof item === 'object' && item.customizable));
                    }
                }
            }
            return false;
        }

        function updateOrderUI() {
            const orderList = getCurrentOrderList();

            // 1. 更新左側菜單上的總份數（加總同品名所有客製組合）與按鈕狀態
            const allQtyDisplays = document.querySelectorAll('[data-qty-display]');
            allQtyDisplays.forEach(el => {
                const name = el.dataset.qtyDisplay;
                const totalForItem = orderList
                    .filter(item => item.name === name)
                    .reduce((sum, item) => sum + item.qty, 0);
                
                el.textContent = totalForItem;
                
                const minusBtn = document.querySelector(`[data-minus-btn="${name}"]`);
                const card = document.querySelector(`[data-item-card="${name}"]`);
                
                if (minusBtn) minusBtn.disabled = totalForItem === 0;
                if (card) {
                    if (totalForItem > 0) {
                        card.classList.add('border-amber-400', 'bg-amber-50/40');
                        card.classList.remove('border-slate-200', 'bg-slate-50/50');
                    } else {
                        card.classList.remove('border-amber-400', 'bg-amber-50/40');
                        card.classList.add('border-slate-200', 'bg-slate-50/50');
                    }
                }
            });

            // 2. 計算當前餐廳總份數
            const totalQty = orderList.reduce((sum, item) => sum + item.qty, 0);
            totalCountBadge.textContent = `共 ${totalQty} 份`;

            // 3. 更新右側互動明細列表
            if (orderList.length === 0) {
                emptyState.classList.remove('hidden');
                orderItemsList.classList.add('hidden');
                copyBtn.disabled = true;
                clearBtn.disabled = true;
            } else {
                emptyState.classList.add('hidden');
                orderItemsList.classList.remove('hidden');
                copyBtn.disabled = false;
                clearBtn.disabled = false;

                orderItemsList.innerHTML = '';
                orderList.forEach((item, index) => {
                    const canCustomize = isItemCustomizableInCurrentStore(item.name);
                    const noteBadgeHtml = item.note
                        ? `<span class="inline-block mt-0.5 text-xs font-semibold text-amber-800 bg-amber-100 px-2 py-0.5 rounded-md">${item.note}</span>`
                        : '';
                    const editBtnHtml = canCustomize
                        ? `<button type="button" onclick="openCustomModal('${item.name}', '${item.id}')" class="text-slate-400 hover:text-amber-600 p-1 rounded-lg transition" title="調整客製口味"><i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i></button>`
                        : '';

                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-sm gap-2';
                    li.innerHTML = `
                        <div class="flex items-start gap-2.5 min-w-0">
                            <span class="w-5 h-5 mt-0.5 rounded-full bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center shrink-0">
                                ${index + 1}
                            </span>
                            <div class="min-w-0">
                                <div class="font-medium text-slate-800 truncate">${item.name}</div>
                                ${noteBadgeHtml}
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            ${editBtnHtml}
                            <button type="button" onclick="changeOrderRowQty('${item.id}', -1)" class="w-6 h-6 rounded-md border border-slate-300 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 text-xs font-bold">-</button>
                            <span class="font-bold text-amber-600 bg-amber-100/70 px-2 py-0.5 rounded-md min-w-[2.2rem] text-center">
                                x${item.qty}
                            </span>
                            <button type="button" onclick="changeOrderRowQty('${item.id}', 1)" class="w-6 h-6 rounded-md border border-slate-300 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 text-xs font-bold">+</button>
                            <button 
                                type="button" 
                                onclick="removeOrderRow('${item.id}')" 
                                class="text-slate-400 hover:text-rose-500 p-1 rounded-lg transition"
                                title="刪除此品項"
                            >
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    orderItemsList.appendChild(li);
                });
                safeIcons();
            }

            // 4. 更新純文字輸出區
            updateOutputText();
        }

        // 固定輸出「品項 x數量」或「品項 x數量，客製備註」格式
        function updateOutputText() {
            const orderList = getCurrentOrderList();
            if (orderList.length === 0) {
                outputTextarea.value = '';
                return;
            }

            const lines = orderList.map(item => {
                const base = `${item.name} x${item.qty}`;
                return item.note ? `${base}，${item.note}` : base;
            });
            outputTextarea.value = lines.join('\n');
        }

        // ==========================================
        // 8. 複製功能
        // ==========================================
        async function copyOrderToClipboard() {
            const orderList = getCurrentOrderList();
            if (orderList.length === 0) return;

            const textToCopy = outputTextarea.value;
            const storeName = getCurrentStore().shortName;

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textToCopy);
                    showToast(`已複製「${storeName}」點餐明細！`);
                } else {
                    fallbackCopyText(textToCopy, storeName);
                }
            } catch (err) {
                fallbackCopyText(textToCopy, storeName);
            }
        }

        function fallbackCopyText(text, storeName) {
            try {
                outputTextarea.select();
                outputTextarea.setSelectionRange(0, 99999);
                const successful = document.execCommand('copy');
                window.getSelection().removeAllRanges();

                if (successful) {
                    showToast(`已複製「${storeName}」點餐明細！`);
                } else {
                    showToast('複製失敗，請手動全選複製');
                }
            } catch (err) {
                console.error('複製失敗:', err);
                showToast('複製失敗，請手動全選複製');
            }
        }

        // 複製目前餐廳的專屬獨立網址（自動帶入 ?store=1 或 ?store=3）
        window.copyStoreUrl = async function() {
            const store = getCurrentStore();
            let shareUrl = '';

            try {
                if (window.location.protocol === 'blob:') {
                    shareUrl = `?store=${store.paramCode}`;
                } else {
                    const url = new URL(window.location.href);
                    url.search = `?store=${store.paramCode}`;
                    url.hash = '';
                    shareUrl = url.toString();
                }

                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(shareUrl);
                    showToast(`已複製「${store.shortName}」專屬網址 (?store=${store.paramCode})`);
                } else {
                    copyRawTextFallback(shareUrl, `已複製「${store.shortName}」專屬網址 (?store=${store.paramCode})`);
                }
            } catch (err) {
                copyRawTextFallback(shareUrl, `已複製「${store.shortName}」專屬網址`);
            }
        };

        function copyRawTextFallback(text, successMsg) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999);
            try {
                document.execCommand('copy');
                showToast(successMsg);
            } catch (e) {
                showToast('複製失敗，請手動複製網址列');
            }
            document.body.removeChild(tempInput);
        }

        function showToast(message) {
            toastMsgEl.textContent = message;
            toastEl.classList.remove('translate-y-20', 'opacity-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
