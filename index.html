<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易點餐工具</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (Noto Sans TC 與 Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 引入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        /* 自訂捲軸樣式，讓明細區域更美觀 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="bg-amber-500 text-white p-2 rounded-xl shadow-sm">
                    <i data-lucide="utensils" class="w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">簡易點餐系統</h1>
            </div>
            <div class="text-sm text-slate-500 hidden sm:block">
                點擊「+」加入餐點，系統將依點餐順序自動整理明細
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <!-- 左側：菜單選擇區 (佔 7 欄) -->
            <div class="lg:col-span-7 space-y-6" id="menu-container">
                <!-- 菜單分類將透過 JavaScript 動態渲染於此 -->
            </div>

            <!-- 右側：點餐明細與輸出區 (佔 5 欄，在桌機版固定於上方) -->
            <div class="lg:col-span-5 lg:sticky lg:top-22 space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <!-- 明細標題列 -->
                    <div class="p-4 sm:p-5 bg-slate-900 text-white flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="receipt" class="w-5 h-5 text-amber-400"></i>
                            <h2 class="font-bold text-lg">點餐明細（依點餐順序）</h2>
                        </div>
                        <span id="total-count-badge" class="bg-amber-500 text-slate-950 text-xs font-bold px-2.5 py-1 rounded-full">
                            共 0 份
                        </span>
                    </div>

                    <!-- 互動式明細列表 -->
                    <div class="p-4 sm:p-5 max-h-[40vh] overflow-y-auto border-b border-slate-100" id="order-list-container">
                        <!-- 空白狀態 -->
                        <div id="empty-state" class="py-10 text-center text-slate-400 flex flex-col items-center justify-center">
                            <i data-lucide="clipboard-list" class="w-12 h-12 mb-3 text-slate-300 stroke-[1.5]"></i>
                            <p class="text-sm font-medium text-slate-500">尚未選擇任何餐點</p>
                            <p class="text-xs mt-1">請從左側菜單點擊「+」開始點餐</p>
                        </div>
                        
                        <!-- 訂單項目列表 -->
                        <ul id="order-items-list" class="space-y-2.5 hidden">
                            <!-- 動態產生項目 -->
                        </ul>
                    </div>

                    <!-- 純文字輸出預覽區 -->
                    <div class="p-4 sm:p-5 bg-slate-50 space-y-3">
                        <div class="flex items-center justify-between">
                            <label for="output-textarea" class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
                                <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                                輸出格式預覽 (可直接複製)
                            </label>
                            <select id="format-selector" class="text-xs bg-white border border-slate-300 rounded-lg px-2 py-1 text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-500">
                                <option value="standard">品項 x數量</option>
                                <option value="numbered">1. 品項 x數量</option>
                                <option value="space">品項 數量份</option>
                            </select>
                        </div>
                        
                        <textarea 
                            id="output-textarea" 
                            rows="6" 
                            readonly 
                            placeholder="點餐後的文字明細將顯示在這裡..."
                            class="w-full rounded-xl border border-slate-200 bg-white p-3 text-sm text-slate-700 font-mono focus:outline-none focus:ring-2 focus:ring-amber-500 resize-none shadow-inner"
                        ></textarea>

                        <!-- 操作按鈕群 -->
                        <div class="grid grid-cols-3 gap-2.5 pt-1">
                            <button 
                                id="clear-btn" 
                                type="button"
                                class="col-span-1 flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-slate-300 bg-white text-slate-600 text-sm font-medium hover:bg-slate-100 hover:text-slate-900 active:scale-[0.98] transition disabled:opacity-40 disabled:pointer-events-none"
                                disabled
                            >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                <span>清空</span>
                            </button>
                            <button 
                                id="copy-btn" 
                                type="button"
                                class="col-span-2 flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-xl bg-amber-500 text-slate-950 text-sm font-bold hover:bg-amber-400 active:scale-[0.98] transition shadow-sm disabled:opacity-40 disabled:pointer-events-none"
                                disabled
                            >
                                <i data-lucide="copy" class="w-4 h-4"></i>
                                <span>複製點餐明細</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 提示訊息 Toast (取代 alert) -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2.5 text-sm font-medium border border-slate-700">
            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
            <span id="toast-message">已複製到剪貼簿！</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 菜單資料定義 (依照分類整理)
        // ==========================================
        const MENU_DATA = [
            {
                category: "火鍋",
                icon: "flame",
                color: "text-rose-500",
                bgBadge: "bg-rose-50",
                items: [
                    "韓式泡菜鍋",
                    "沙茶牛肉鍋",
                    "沙茶豬肉鍋",
                    "經典泡菜鍋"
                ]
            },
            {
                category: "炒飯",
                icon: "utensils-crossed",
                color: "text-amber-600",
                bgBadge: "bg-amber-50",
                items: [
                    "沙茶牛肉炒飯",
                    "沙茶豬肉炒飯",
                    "鹹豬肉炒飯",
                    "蝦仁炒飯"
                ]
            },
            {
                category: "炒麵",
                icon: "soup",
                color: "text-orange-500",
                bgBadge: "bg-orange-50",
                items: [
                    "沙茶牛肉炒麵",
                    "沙茶豬肉炒麵",
                    "海鮮炒麵",
                    "麻油麵線"
                ]
            },
            {
                category: "湯品",
                icon: "cup-soda",
                color: "text-emerald-600",
                bgBadge: "bg-emerald-50",
                items: [
                    "蚵仔湯",
                    "薑絲蛤蜊湯",
                    "貢丸湯",
                    "紫菜蛋花湯",
                    "豆腐湯"
                ]
            }
        ];

        // ==========================================
        // 2. 狀態管理
        // 使用陣列儲存點餐項目，確保嚴格遵守「依序點餐」的順序
        // 格式: [{ name: '韓式泡菜鍋', qty: 1 }, ...]
        // ==========================================
        let orderList = [];
        let toastTimeout = null;

        // ==========================================
        // 3. DOM 元素參照
        // ==========================================
        const menuContainer = document.getElementById('menu-container');
        const orderItemsList = document.getElementById('order-items-list');
        const emptyState = document.getElementById('empty-state');
        const outputTextarea = document.getElementById('output-textarea');
        const totalCountBadge = document.getElementById('total-count-badge');
        const copyBtn = document.getElementById('copy-btn');
        const clearBtn = document.getElementById('clear-btn');
        const formatSelector = document.getElementById('format-selector');
        const toastEl = document.getElementById('toast');
        const toastMsgEl = document.getElementById('toast-message');

        // ==========================================
        // 4. 初始化與渲染函數
        // ==========================================
        function init() {
            renderMenu();
            updateOrderUI();
            lucide.createIcons();

            // 綁定全域按鈕事件
            copyBtn.addEventListener('click', copyOrderToClipboard);
            clearBtn.addEventListener('click', clearAllOrders);
            formatSelector.addEventListener('change', updateOutputText);
        }

        // 渲染左側菜單卡片
        function renderMenu() {
            menuContainer.innerHTML = '';

            MENU_DATA.forEach(group => {
                const section = document.createElement('section');
                section.className = 'bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5';

                // 分類標題
                const headerHtml = `
                    <div class="flex items-center gap-2 mb-4 pb-2.5 border-b border-slate-100">
                        <div class="p-1.5 rounded-lg ${group.bgBadge} ${group.color}">
                            <i data-lucide="${group.icon}" class="w-5 h-5"></i>
                        </div>
                        <h3 class="font-bold text-base sm:text-lg text-slate-800">${group.category}</h3>
                    </div>
                `;

                // 餐點網格
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-3';

                group.items.forEach(itemName => {
                    const card = document.createElement('div');
                    card.className = 'flex items-center justify-between p-3 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-white hover:border-amber-300 hover:shadow-sm transition-all duration-150';
                    card.dataset.itemCard = itemName;

                    card.innerHTML = `
                        <span class="font-medium text-slate-800 text-sm sm:text-base select-none">${itemName}</span>
                        <div class="flex items-center gap-2">
                            <button 
                                type="button" 
                                onclick="changeQuantity('${itemName}', -1)"
                                class="w-8 h-8 rounded-lg border border-slate-300 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 active:scale-90 transition disabled:opacity-30 disabled:pointer-events-none"
                                data-minus-btn="${itemName}"
                                disabled
                                aria-label="減少 ${itemName}"
                            >
                                <i data-lucide="minus" class="w-4 h-4"></i>
                            </button>
                            <span 
                                class="w-6 text-center font-bold text-sm text-slate-700 select-none" 
                                data-qty-display="${itemName}"
                            >0</span>
                            <button 
                                type="button" 
                                onclick="changeQuantity('${itemName}', 1)"
                                class="w-8 h-8 rounded-lg bg-amber-500 text-slate-950 flex items-center justify-center hover:bg-amber-400 active:scale-90 transition shadow-sm"
                                aria-label="增加 ${itemName}"
                            >
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                section.innerHTML = headerHtml;
                section.appendChild(grid);
                menuContainer.appendChild(section);
            });
        }

        // ==========================================
        // 5. 核心點餐邏輯
        // ==========================================
        window.changeQuantity = function(itemName, delta) {
            try {
                const existingIndex = orderList.findIndex(item => item.name === itemName);

                if (existingIndex > -1) {
                    // 品項已在訂單中，更新數量
                    const newQty = orderList[existingIndex].qty + delta;
                    if (newQty <= 0) {
                        // 數量歸零，從陣列中移除
                        orderList.splice(existingIndex, 1);
                    } else {
                        orderList[existingIndex].qty = newQty;
                    }
                } else if (delta > 0) {
                    // 新點品項，推入陣列尾端以保留「點餐順序」
                    orderList.push({ name: itemName, qty: delta });
                }

                updateOrderUI();
            } catch (error) {
                console.error('更新餐點數量時發生錯誤:', error);
            }
        };

        // 移除單一品項
        window.removeItem = function(itemName) {
            orderList = orderList.filter(item => item.name !== itemName);
            updateOrderUI();
        };

        // 清空所有訂單
        function clearAllOrders() {
            if (orderList.length === 0) return;
            orderList = [];
            updateOrderUI();
            showToast('已清空所有點餐紀錄');
        }

        // ==========================================
        // 6. 同步更新畫面 (菜單數量、右側明細、輸出文字)
        // ==========================================
        function updateOrderUI() {
            // 1. 更新左側菜單上的數字與按鈕狀態
            const allQtyDisplays = document.querySelectorAll('[data-qty-display]');
            allQtyDisplays.forEach(el => {
                const name = el.dataset.qtyDisplay;
                const found = orderList.find(item => item.name === name);
                const qty = found ? found.qty : 0;
                
                el.textContent = qty;
                
                // 更新減號按鈕狀態與卡片高亮
                const minusBtn = document.querySelector(`[data-minus-btn="${name}"]`);
                const card = document.querySelector(`[data-item-card="${name}"]`);
                
                if (minusBtn) {
                    minusBtn.disabled = qty === 0;
                }
                if (card) {
                    if (qty > 0) {
                        card.classList.add('border-amber-400', 'bg-amber-50/40');
                        card.classList.remove('border-slate-200', 'bg-slate-50/50');
                    } else {
                        card.classList.remove('border-amber-400', 'bg-amber-50/40');
                        card.classList.add('border-slate-200', 'bg-slate-50/50');
                    }
                }
            });

            // 2. 計算總份數
            const totalQty = orderList.reduce((sum, item) => sum + item.qty, 0);
            totalCountBadge.textContent = `共 ${totalQty} 份`;

            // 3. 更新右側互動明細列表
            if (orderList.length === 0) {
                emptyState.classList.remove('hidden');
                orderItemsList.classList.add('hidden');
                copyBtn.disabled = true;
                clearBtn.disabled = true;
            } else {
                emptyState.classList.add('hidden');
                orderItemsList.classList.remove('hidden');
                copyBtn.disabled = false;
                clearBtn.disabled = false;

                orderItemsList.innerHTML = '';
                orderList.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-200/80 text-sm';
                    li.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <span class="w-5 h-5 rounded-full bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center">
                                ${index + 1}
                            </span>
                            <span class="font-medium text-slate-800">${item.name}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-amber-600 bg-amber-100/70 px-2 py-0.5 rounded-md">
                                x${item.qty}
                            </span>
                            <button 
                                type="button" 
                                onclick="removeItem('${item.name}')" 
                                class="text-slate-400 hover:text-rose-500 p-1 rounded-lg transition"
                                title="刪除此品項"
                            >
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    orderItemsList.appendChild(li);
                });
                // 重新渲染動態產生的圖示
                lucide.createIcons();
            }

            // 4. 更新純文字輸出區
            updateOutputText();
        }

        // 依照選擇的格式生成文字輸出
        function updateOutputText() {
            if (orderList.length === 0) {
                outputTextarea.value = '';
                return;
            }

            const format = formatSelector.value;
            const totalQty = orderList.reduce((sum, item) => sum + item.qty, 0);

            const lines = orderList.map((item, idx) => {
                if (format === 'numbered') {
                    return `${idx + 1}. ${item.name} x${item.qty}`;
                } else if (format === 'space') {
                    return `${item.name} ${item.qty}份`;
                } else {
                    // 預設 standard: 品項 x數量
                    return `${item.name} x${item.qty}`;
                }
            });

            lines.push('---');
            lines.push(`總計：${totalQty} 份`);

            outputTextarea.value = lines.join('\n');
        }

        // ==========================================
        // 7. 複製功能 (使用相容性最高的 execCommand)
        // ==========================================
        function copyOrderToClipboard() {
            if (orderList.length === 0) return;

            try {
                outputTextarea.select();
                outputTextarea.setSelectionRange(0, 99999); // 支援行動裝置
                const successful = document.execCommand('copy');
                
                // 取消選取反白狀態，保持視覺整潔
                window.getSelection().removeAllRanges();

                if (successful) {
                    showToast('點餐明細已複製！可直接貼上發送');
                } else {
                    showToast('複製失敗，請手動全選複製');
                }
            } catch (err) {
                console.error('複製失敗:', err);
                showToast('複製失敗，請手動全選複製');
            }
        }

        // 顯示底部提示訊息
        function showToast(message) {
            toastMsgEl.textContent = message;
            toastEl.classList.remove('translate-y-20', 'opacity-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // 啟動應用程式
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
